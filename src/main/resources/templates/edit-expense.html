<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Expense</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<aside class="sidebar">
    <div class="brand">
        <div class="brand-icon">₹</div>
        <div>
            <div class="brand-name">LEDGER</div>
            <div class="brand-sub">Expense Tracker</div>
        </div>
    </div>
    <nav>
        <a href="/">           <span class="nav-icon">◈</span> Dashboard</a>
        <a href="/expenses">   <span class="nav-icon">◎</span> Expenses</a>
        <a href="/budget-status"><span class="nav-icon">◉</span> Budget Status</a>
    </nav>
</aside>

<main class="main">
    <div class="page">
        <h2 class="page-title">Edit Expense</h2>
        <div class="card">
            <form th:action="@{/edit-expense/{id}(id=${expense.id})}" method="post">
                <div class="form-group">
                    <label class="form-label">Amount (₹)</label>
                    <input type="number" name="amount" step="0.01" min="1" required
                           th:value="${expense.amount}">
                </div>
                <div class="form-group">
                    <label class="form-label">Category</label>
                        <select name="category" required>
                            <option value="Bills"
                                    th:selected="${expense.category == 'Bills'}">Bills</option>

                            <option value="Food & Dining"
                                    th:selected="${expense.category == 'Food & Dining'}">Food & Dining</option>

                            <option value="Shopping"
                                    th:selected="${expense.category == 'Shopping'}">Shopping</option>

                            <option value="Healthcare"
                                    th:selected="${expense.category == 'Healthcare'}">Healthcare</option>

                            <option value="Housing"
                                    th:selected="${expense.category == 'Housing'}">Housing</option>

                            <option value="Groceries"
                                    th:selected="${expense.category == 'Groceries'}">Groceries</option>

                            <option value="Education"
                                    th:selected="${expense.category == 'Education'}">Education</option>

                            <option value="Transportation & Travel"
                                    th:selected="${expense.category == 'Transportation & Travel'}">
                                Transportation & Travel
                            </option>

                            <option value="Miscellaneous"
                                    th:selected="${expense.category == 'Miscellaneous'}">Miscellaneous</option>

                            <option value="Other"
                                    th:selected="${expense.category == 'Other'}">Other</option>
                        </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Description <span style="color:#555;">(optional)</span></label>
                    <input type="text" name="description" th:value="${expense.description}">
                </div>
                <div class="form-group">
                    <label class="form-label">Date</label>
                    <input type="date" name="date" required th:value="${expense.date}">
                </div>
                <button type="submit" class="btn-primary">Save Changes</button>
            </form>
            <a href="/expenses" class="back-link">← Cancel and go back</a>
        </div>
    </div>
</main>

</body>
</html>
