<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Expense</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<aside class="sidebar">
    <div class="brand">
        <div class="brand-icon">₹</div>
        <div>
            <div class="brand-name">LEDGER</div>
            <div class="brand-sub">Expense Tracker</div>
        </div>
    </div>
    <nav>
        <a href="/">                          <span class="nav-icon">◈</span> Dashboard</a>
        <a href="/expenses">                  <span class="nav-icon">◎</span> Expenses</a>
        <a href="/budget-status"><span class="nav-icon">◉</span> Budget Status</a>
    </nav>
</aside>

<main class="main">
    <div class="page">
        <h2 class="page-title">Add Expense</h2>

        <div class="card">
            <form action="/add-expense" method="post">

                <div class="form-group">
                    <label class="form-label">Category</label>
                        <select name="category" required>
                            <option value="">-- Select Category --</option>
                            <option value="Bills">Bills</option>
                            <option value="Food & Dining">Food & Dining</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Healthcare">Healthcare</option>
                            <option value="Housing">Housing</option>
                            <option value="Groceries">Groceries</option>
                            <option value="Education">Education</option>
                            <option value="Transportation & Travel">Transportation & Travel</option>
                            <option value="Miscellaneous">Miscellaneous</option>
                            <option value="Other">Other</option>
                        </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Amount (₹)</label>
                    <input type="number" name="amount" placeholder="e.g. 500"
                           step="0.01" min="1" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Description <span style="color:#555;">(optional)</span></label>
                    <input type="text" name="description" placeholder="e.g. Lunch with friends">
                </div>

                <div class="form-group">
                    <label class="form-label">Date</label>
                    <input type="date" name="date" required>
                </div>

                <button type="submit" class="btn-primary">Add Expense</button>
            </form>

            <a href="/" class="back-link">← Back to Dashboard</a>
        </div>
    </div>
</main>

</body>
</html>
